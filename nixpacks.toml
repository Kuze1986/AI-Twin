# Hard-pin Node 24: Railway/Nixpacks must use this nixpkgs snapshot (same hash Nixpacks maps to nodejs_24).
# Relying only on package.json engines can be skipped if the wrong commit or config is picked up.
[phases.setup]
nixpkgsArchive = "23f9169c4ccce521379e602cc82ed873a1f1b52b"
nixPkgs = ["nodejs_24", "npm-9_x"]

[variables]
# Keep workspace devDependencies (tsc/vite) installed during build.
NPM_CONFIG_PRODUCTION = "false"

[phases.install]
# Be explicit: Railway must install workspace dev deps for client build tools (tsc/vite).
cmds = ["npm ci --include=dev"]

[phases.build]
# Build both client and server before starting
cmds = ["npm run build"]
